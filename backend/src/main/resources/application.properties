spring.application.name=backend

# 1. ??i c?ng t? 6543 th�nh 5432 v� th�m tham s? options ? cu?i URL
spring.datasource.url=jdbc:postgresql://aws-1-ap-southeast-1.pooler.supabase.com:5432/postgres?sslmode=require&prepareThreshold=0&options=-c%20search_path%3Dpublic

# 2. ??t Username quay v? thu?n 'postgres' nh? ban ??u
spring.datasource.username=${MY_DB_USER}
spring.datasource.password=${MY_DB_PASS}

# Cấu hình Google OAuth
google.client.id=${GOOGLE_CLIENT_ID}
google.client.secret=${GOOGLE_CLIENT_SECRET}

# --- CẤU HÌNH MAIL CHUẨN CỦA SPRING BOOT ---
# Thay vì dùng 'email.user', ta dùng các key chuẩn này và map vào biến môi trường của bạn
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${EMAIL_USER}
spring.mail.password=${EMAIL_PASS}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=validate

spring.jpa.show-sql=true


spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
cloudinary.cloud-name=${CLOUD_NAME}
cloudinary.api-key=${API_KEY}
cloudinary.api-secret=${API_SECRET}


# Cấu hình VNPay Sandbox
vnpay.tmnCode=${VNPAY_CODE}
vnpay.hashSecret=${VNPAY_SECRET}
vnpay.payUrl=https://sandbox.vnpayment.vn/paymentv2/vpcpay.html
vnpay.returnUrl=http://localhost:5173/vnpay-return
vnpay.version=2.1.0
vnpay.command=pay

