spring.application.name=backend

spring.datasource.url=jdbc:postgresql://aws-1-ap-southeast-1.pooler.supabase.com:6543/postgres?sslmode=require&prepareThreshold=0
# Dùng cấu trúc ${TÊN_BIẾN} để làm đại diện
spring.datasource.username=${MY_DB_USER}
spring.datasource.password=${MY_DB_PASS}

# Cấu hình Google OAuth
google.client.id=${GOOGLE_CLIENT_ID}
google.client.secret=${GOOGLE_CLIENT_SECRET}

# --- CẤU HÌNH MAIL CHUẨN CỦA SPRING BOOT ---
# Thay vì dùng 'email.user', ta dùng các key chuẩn này và map vào biến môi trường của bạn
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${EMAIL_USER}
spring.mail.password=${EMAIL_PASS}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

